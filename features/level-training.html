<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새록 · 나의 기억 단계와 훈련</title>
<style>
:root{--bg:#f3f1f8;--panel:#fff;--ink:#2c283d;--muted:#6b6880;--line:#e4e0ee;--brand:#5d55be;--brand-soft:#efebfa;--on-brand:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#17151f;--panel:#221f2d;--ink:#f1eff8;--muted:#a9a5bd;--line:#34304a;--brand:#9c95f0;--brand-soft:#2c2840;--on-brand:#17151f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/29px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
main{max-width:420px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-size:30px;line-height:43px;margin:8px 0 12px}
h2{font-size:24px;line-height:34px;margin:0 0 12px}
a,button,input{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.back{display:inline-flex;align-items:center;min-height:56px;color:var(--brand);font-weight:700;text-decoration:none}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:16px;line-height:24px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;margin:16px 0}
.level{display:flex;align-items:baseline;gap:12px}
.level b{font-size:56px;line-height:64px;color:var(--brand)}
.muted{color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:16px 0 4px;padding:0;list-style:none}
.ladder li{height:44px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.ladder li[aria-current]{background:var(--brand);color:var(--on-brand);font-weight:800;transform:scaleY(1.15)}
.ends{display:flex;justify-content:space-between;font-size:16px}
dl{margin:0}dt{font-weight:700;margin-top:12px}dd{margin:4px 0 0}
ul.plain{margin:4px 0 0;padding-left:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 16px;border-radius:999px;border:2px solid var(--brand);color:var(--brand);font-weight:700}
.family{border-left:6px solid var(--brand)}
button.primary{display:block;width:100%;min-height:64px;border:0;border-radius:18px;background:var(--brand);color:var(--on-brand);font-weight:800;cursor:pointer}
label{display:block;font-weight:700}
input[type=range]{width:100%;min-height:56px;accent-color:var(--brand)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:388px;width:calc(100% - 32px);padding:16px 20px;border-radius:16px;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.ladder li[aria-current]{transform:none}}
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html">← 새록 데모</a>
  <span class="tag">데모 · 진단 결과가 아니에요</span>
  <h1>나의 기억 단계</h1>

  <section class="card" aria-labelledby="lv-title">
    <div class="level"><b id="lv-num">7</b><span><span id="lv-title">단계</span> <span class="muted">/ 10 · <span id="lv-score">64</span>점</span></span></div>
    <ol class="ladder" id="ladder" aria-label="10단계 중 현재 위치"></ol>
    <div class="ends muted" aria-hidden="true"><span>1단계</span><span>10단계</span></div>
    <p id="lv-desc"></p>
  </section>

  <section class="card" id="weak-card" hidden>
    <h2>이 영역을 조금 더 연습해요</h2>
    <div class="chips" id="weak"></div>
  </section>

  <section class="card" aria-labelledby="plan-title">
    <h2 id="plan-title">이번 단계의 훈련</h2>
    <dl>
      <dt>이런 활동을 해요</dt><dd><ul class="plain" id="plan-train"></ul></dd>
      <dt>얼마나 자주</dt><dd id="plan-freq"></dd>
      <dt>생활 속에서 함께해요</dt><dd id="plan-habit"></dd>
    </dl>
  </section>

  <section class="card family" id="family" hidden>
    <h2>가족에게 알릴지 본인이 정해요</h2>
    <p>원하시면 연습 소식을 가족에게 전할 수 있어요. 가족이 제안해도, 바꾸는 건 언제나 본인이 정해요.</p>
  </section>

  <button class="primary" id="save" type="button">이번 주 훈련 계획에 담기</button>

  <section class="card">
    <label for="slider">데모로 점수 바꿔 보기: <span id="slider-val">64</span>점</label>
    <input id="slider" type="range" min="0" max="100" step="1" value="64">
    <p class="muted">점수는 연습 방법을 고르는 데만 써요. 건강 상태를 판단하지 않아요.</p>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  // Source: Notion 주차별 계획 2주차 "기억력 수준 단계별 구분" + "기억력 훈련 메커니즘 설계", rewritten in non-clinical voice.
  const LEVELS = [
    {desc:'지금은 아주 가볍게 시작하는 단계예요. 부담 없이 이야기 나누는 것부터 함께해요.', train:['편안한 음성 대화','버튼 누르기·소리 듣기처럼 쉬운 활동 (힌트가 늘 함께해요)'], freq:'매일 1회 · 5분 안쪽', habit:'잠자고 식사하는 시간을 알림으로 맞춰 두기', family:true},
    {desc:'천천히 따라가며 익숙해지는 단계예요. 짧은 대화와 쉬운 연습을 함께해요.', train:['익숙한 물건 짝 맞추기','그림과 이름을 함께 보고 듣기'], freq:'주 2~3회 · 5~10분', habit:'물 자주 마시기, 매일 같은 시간에 집 근처 산책', family:true},
    {desc:'기본은 잘 지키고 계세요. 떠올리는 데 시간이 조금 걸릴 땐 매일의 루틴을 함께 만들어요.', train:['두 가지를 기억했다가 떠올리기','사진을 단서로 떠올리기'], freq:'주 3회 · 10분', habit:'영양제 챙김 체크리스트, 편안한 잠자리 만들기', family:true},
    {desc:'힌트가 있으면 더 편하게 떠올리시는 단계예요. 여러 영역을 차근차근 함께 연습해요.', train:['같은 종류끼리 떠올리기','이야기 속 장면 기억 게임','음성으로 1:1 연습'], freq:'주 3~4회 · 10분', habit:'일기장에 사진과 음성 메모 남기기', family:true},
    {desc:'말이 바로 떠오르지 않거나, 순서를 바꿔 생각할 때 조금 시간이 걸리는 단계예요.', train:['숫자·단어 3개 거꾸로 말하기','크기 순서대로 놓기','듣고 따라 말하기'], freq:'주 4회 · 10~15분', habit:'하루 20분 이상 걷기'},
    {desc:'여러 정보를 한 번에 다룰 때 조금 느려질 수 있어요. 집중과 순서 연습을 함께해요.', train:['30초 동안 같은 종류 말하기','비슷한 말·반대말 맞히기'], freq:'주 4회 · 15분', habit:'신문 기사 한 줄 읽고 따라 말하기'},
    {desc:'전반적으로 잘하고 계세요. 조건이 여러 개면 조금 피곤하실 수 있어요.', train:['시계 바늘 옮겨 보기','소리가 있는 곳에서 떠올리기','어울리는 단어 짝짓기'], freq:'주 4~5회 · 15분', habit:'젓가락질·종이접기 같은 손 운동'},
    {desc:'또래 평균보다 잘하고 계세요. 지금의 리듬을 편하게 이어가요.', train:['숫자 4개 거꾸로 말하기','두 가지 일 동시에 하기'], freq:'주 3회 · 10분', habit:'잠든 시간 기록하기, 이웃·친구와 대화 늘리기'},
    {desc:'기억하고 떠올리는 게 빠르고 정확해요. 세밀한 공간 감각 연습을 더해 봐요.', train:['그림 속 상황 설명하기','속담 뜻 맞히기·문장 완성하기'], freq:'주 2회 · 10분', habit:'일기장 자세히 써 보기'},
    {desc:'모든 영역을 스스로 잘 챙기고 계세요. 도전 과제를 즐겨 보세요.', train:['도형 돌려 보기','바로 전 그림 기억하기','나의 추억 자서전 쓰기'], freq:'원하는 만큼 매일 자유롭게', habit:'다른 어르신을 돕는 봉사나 새로운 배움'}
  ];
  const MODULES = {A:'지남력·상식', B:'에피소드 기억·회상', C:'작업 기억', D:'시공간', E:'언어 유창성'};

  function levelOf(score) { return Math.min(10, Math.max(1, Math.ceil(score / 10))); }

  const params = new URLSearchParams(location.search);
  const raw = parseInt(params.get('score'), 10);
  let score = Number.isFinite(raw) ? Math.min(100, Math.max(0, raw)) : 64;
  const weak = [...new Set((params.get('weak') || '').toUpperCase().split(',').map(s => s.trim()).filter(s => s in MODULES))];

  const $ = id => document.getElementById(id);
  const ladder = $('ladder');
  for (let i = 1; i <= 10; i++) { const li = document.createElement('li'); li.textContent = i; ladder.appendChild(li); }

  if (weak.length) {
    $('weak-card').hidden = false;
    for (const m of weak) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = MODULES[m]; $('weak').appendChild(s); }
  }

  function render() {
    const lv = levelOf(score), d = LEVELS[lv - 1];
    $('lv-num').textContent = lv;
    $('lv-title').textContent = lv + '단계';
    $('lv-score').textContent = score;
    $('lv-desc').textContent = d.desc;
    [...ladder.children].forEach((li, i) => { if (i + 1 === lv) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    $('plan-train').replaceChildren(...d.train.map(t => { const li = document.createElement('li'); li.textContent = t; return li; }));
    $('plan-freq').textContent = d.freq;
    $('plan-habit').textContent = d.habit;
    $('family').hidden = !d.family;
    $('slider').value = score;
    $('slider-val').textContent = score;
  }

  let timer;
  function toast(text) { const el = $('toast'); el.textContent = text; el.classList.add('on'); clearTimeout(timer); timer = setTimeout(() => el.classList.remove('on'), 2600); }

  $('slider').addEventListener('input', e => { score = Number(e.target.value); render(); });
  $('save').addEventListener('click', () => {
    const lv = levelOf(score), d = LEVELS[lv - 1];
    const plan = {level: lv, score, training: d.train, freq: d.freq, habit: d.habit, weak, savedAt: new Date().toISOString()};
    try { localStorage.setItem('saerok-plan', JSON.stringify(plan)); toast(lv + '단계 훈련을 이번 주 계획에 담았어요.'); }
    catch (_) { toast('이 브라우저에서는 저장할 수 없어요. 화면에서만 확인해 주세요.'); }
  });

  render();
})();
</script>
</body>
</html>
