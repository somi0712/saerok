<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새록 보호자 연동</title>
<style>
:root{--bg:#f3f1f8;--panel:#fff;--ink:#2c283d;--muted:#6b6880;--line:#e4e0ee;--brand:#5d55be;--brand-soft:#efebfa;--warn:#9a4a00;--warn-soft:#fff3e6}
@media (prefers-color-scheme:dark){:root{--bg:#17151f;--panel:#221f2d;--ink:#f1eff8;--muted:#a9a5bd;--line:#34304a;--brand:#9c95f0;--brand-soft:#2c2840;--warn:#ffb877;--warn-soft:#3a2a1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/29px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all}
main{max-width:420px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:30px;line-height:43px;margin:8px 0 4px}
h2{font-size:22px;line-height:31px;margin:0 0 8px}
p{margin:0 0 8px}
a{color:var(--brand)}
.back{display:inline-flex;align-items:center;min-height:56px;font-weight:600;text-decoration:none}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 12px;font-size:16px;font-weight:700}
.muted{color:var(--muted);font-size:18px;line-height:26px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin:0 0 16px}
.card.alert{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.card.alert h2{color:var(--warn)}
button{font:inherit;min-height:56px;border-radius:16px;border:2px solid var(--brand);background:var(--panel);color:var(--brand);font-weight:700;padding:8px 16px;cursor:pointer;width:100%}
button.primary,.tabs button[aria-selected=true]{background:var(--brand);color:var(--panel)}
button.quiet{border-color:var(--line);color:var(--ink)}
button+button{margin-top:8px}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.days{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;text-align:center}
.bar{height:96px;display:flex;align-items:flex-end;justify-content:center}
.bar span{display:block;width:70%;border-radius:8px 8px 4px 4px;background:var(--brand);min-height:4px}
.dot{width:18px;height:18px;border-radius:50%;margin:8px auto 4px;border:3px solid var(--brand)}
.dot.on{background:var(--brand)}
.day{font-size:16px;line-height:22px}
.legend{display:flex;gap:16px;font-size:16px;color:var(--muted);margin-top:8px}
.choice{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:16px;margin:0 0 8px;cursor:pointer}
.choice input{width:28px;height:28px;accent-color:var(--brand);flex:none}
select,textarea{font:inherit;width:100%;min-height:56px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--panel);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
label.field{display:block;margin:8px 0 4px;font-weight:600}
fieldset{border:0;margin:0;padding:0}
legend{font-weight:700;margin-bottom:8px}
.status{border-left:6px solid var(--brand);padding-left:12px}
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html">← 새록 데모</a>
  <p><span class="tag">데모 · 예시 데이터</span></p>
  <h1>보호자 연동</h1>
  <p class="muted">가족은 살펴보고 제안해요. 바꿀지 말지는 정희 님이 정해요.</p>

  <div class="tabs" role="tablist" aria-label="화면 고르기">
    <button role="tab" id="tab-family" aria-controls="view-family" aria-selected="true">보호자 화면</button>
    <button role="tab" id="tab-me" aria-controls="view-me" aria-selected="false">본인 화면</button>
  </div>

  <section id="view-family" role="tabpanel" aria-labelledby="tab-family">
    <p class="muted">딸 민지 님이 보는 화면이에요.</p>
    <div id="family-body"></div>
  </section>

  <section id="view-me" role="tabpanel" aria-labelledby="tab-me" hidden>
    <p class="muted">정희 님이 보는 화면이에요.</p>
    <div id="me-body"></div>
  </section>

  <button class="quiet" id="reset" type="button">데모 처음으로</button>
</main>
<script>
(() => {
  'use strict';
  const KEY = 'saerok-guardian';
  const OPTIONS = {
    fewer: '연습 횟수 줄이기 (주 3회 → 주 2회)',
    easier: '한 단계 쉬운 연습으로',
    time: '알림 시간 바꾸기'
  };
  const TIMES = ['오전 9시', '오전 11시', '오후 3시', '오후 7시'];
  const fresh = () => ({
    sharing: true,
    share: { access: true, practice: true, diary: false },
    inactive: false,
    proposal: null,
    confirmStop: false
  });
  let state = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object' && saved.share) state = { ...fresh(), ...saved, confirmStop: false };
  } catch (_) { /* storage blocked: keep state in memory */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} };

  // Example week, oldest first. Index 1 is "들어왔지만 연습은 쉼"; the toggle blanks the last 3 days.
  function week() {
    const names = ['일', '월', '화', '수', '목', '금', '토'];
    const accessed = [1, 1, 0, 1, 1, 1, 1], done = [1, 0, 0, 2, 1, 1, 1], minutes = [12, 0, 0, 18, 10, 14, 11];
    return accessed.map((a, i) => {
      const d = new Date(); d.setDate(d.getDate() - (6 - i));
      const off = state.inactive && i >= 4;
      return { name: names[d.getDay()], date: (d.getMonth() + 1) + '/' + d.getDate(), accessed: off ? 0 : a, done: off ? 0 : done[i], minutes: off ? 0 : minutes[i] };
    });
  }
  function daysAway(w) { let n = 0; for (let i = w.length - 1; i >= 0 && !w[i].accessed; i--) n++; return n; }

  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid);
    return el;
  };
  const card = (cls, ...kids) => h('div', { class: 'card ' + cls }, ...kids);
  const btn = (text, onclick, cls = '') => h('button', { type: 'button', class: cls, onclick }, text);
  const update = fn => { fn(); save(); render(); };

  function proposalText(p) {
    return p.type === 'time' ? OPTIONS.time + ' → ' + p.time : OPTIONS[p.type];
  }
  function statusLine(p) {
    if (p.status === 'pending') return '정희 님의 확인을 기다리고 있어요.';
    if (p.status === 'accepted') return '정희 님이 제안을 받아들였어요.';
    if (p.status === 'alt') return '정희 님이 다른 방법을 골랐어요: ' + proposalText(p.alt);
    return '정희 님이 지금 방식대로 하기로 했어요. 마음을 전한 것만으로 충분해요.';
  }

  function renderFamily() {
    const root = document.getElementById('family-body');
    root.replaceChildren();
    if (!state.sharing) {
      root.append(card('', h('h2', {}, '공유가 멈춰 있어요'), h('p', {}, '정희 님이 공유를 그만두셨어요. 다시 공유해 주실 때까지 기록이 보이지 않아요.')));
      return;
    }
    const w = week(), away = daysAway(w);
    if (away >= 3) {
      root.append(card('alert', h('h2', {}, away + '일째 들어오지 않으셨어요'),
        h('p', {}, '바쁘시거나 쉬고 계실 수 있어요. 안부 전화 한 통 어떠세요?')));
    } else if (state.share.practice && w.some(d => d.accessed && !d.done)) {
      const d = w.find(d => d.accessed && !d.done);
      root.append(card('alert', h('h2', {}, '연습을 쉰 날이 있어요'),
        h('p', {}, d.date + '(' + d.name + ')에는 들어오셨지만 연습은 쉬셨어요. 쉬는 날도 괜찮아요.')));
    }

    const showAccess = state.share.access, showPractice = state.share.practice;
    const act = card('', h('h2', {}, '최근 7일'));
    if (!showAccess && !showPractice) act.append(h('p', { class: 'muted' }, '정희 님이 활동 기록 공유를 꺼 두셨어요.'));
    else {
      const max = Math.max(...w.map(d => d.minutes), 1);
      act.append(h('ol', { class: 'days' }, w.map(d => {
        const label = d.date + ' ' + d.name + '요일: ' +
          (showAccess ? (d.accessed ? '접속함' : '접속 안 함') : '') +
          (showPractice ? ', 연습 ' + d.done + '번, ' + d.minutes + '분' : '');
        return h('li', { 'aria-label': label },
          showPractice ? h('div', { class: 'bar', 'aria-hidden': 'true' }, h('span', { style: 'height:' + Math.round(d.minutes / max * 100) + '%' })) : null,
          showAccess ? h('div', { class: 'dot' + (d.accessed ? ' on' : ''), 'aria-hidden': 'true' }) : null,
          h('div', { class: 'day', 'aria-hidden': 'true' }, d.name));
      })));
      act.append(h('div', { class: 'legend', 'aria-hidden': 'true' },
        showPractice ? h('span', {}, '막대: 연습 시간') : null,
        showAccess ? h('span', {}, '● 접속 ○ 쉼') : null));
      if (showPractice) {
        const total = w.reduce((s, d) => s + d.done, 0), mins = w.reduce((s, d) => s + d.minutes, 0);
        act.append(h('p', {}, '이번 주 연습 ' + total + '번 · 모두 ' + mins + '분'));
      }
    }
    root.append(act);

    root.append(h('label', { class: 'choice' },
      h('input', { type: 'checkbox', checked: state.inactive, onchange: e => update(() => { state.inactive = e.target.checked; }) }),
      h('span', {}, '3일 미접속 상황 보기 (데모)')));

    const p = state.proposal;
    if (p) {
      root.append(card('', h('h2', {}, '보낸 제안'),
        h('p', { class: 'status' }, proposalText(p)),
        p.note ? h('p', { class: 'muted' }, '“' + p.note + '”') : null,
        h('p', {}, statusLine(p)),
        btn(p.status === 'pending' ? '제안 취소하기' : '새 제안 쓰기', () => update(() => { state.proposal = null; }), 'quiet')));
      return;
    }
    const form = h('form', { onsubmit: e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const type = fd.get('type');
      if (!OPTIONS[type]) return;
      update(() => { state.proposal = { type, time: fd.get('time'), note: String(fd.get('note') || '').trim().slice(0, 200), status: 'pending' }; });
    } },
      h('fieldset', {}, h('legend', {}, '어떤 변화를 제안할까요?'),
        Object.entries(OPTIONS).map(([v, t], i) => h('label', { class: 'choice' }, h('input', { type: 'radio', name: 'type', value: v, checked: i === 0 }), h('span', {}, t)))),
      h('label', { class: 'field', for: 'p-time' }, '알림 시간 (알림 시간 바꾸기를 고를 때)'),
      h('select', { id: 'p-time', name: 'time' }, TIMES.map(t => h('option', {}, t))),
      h('label', { class: 'field', for: 'p-note' }, '함께 보낼 말 (선택)'),
      h('textarea', { id: 'p-note', name: 'note', maxlength: '200', placeholder: '예: 요즘 피곤하신 것 같아서요.' }),
      h('p', { class: 'muted' }, '제안은 정희 님이 수락해야 바뀌어요.'),
      h('button', { type: 'submit', class: 'primary' }, '제안 보내기'));
    root.append(card('', h('h2', {}, '훈련 조정 제안하기'), form));
  }

  function renderMe() {
    const root = document.getElementById('me-body');
    root.replaceChildren();
    const p = state.proposal;
    if (p && p.status === 'pending' && state.sharing) {
      const c = card('', h('h2', {}, '민지 님이 보낸 제안'),
        h('p', { class: 'status' }, proposalText(p)),
        p.note ? h('p', { class: 'muted' }, '“' + p.note + '”') : null,
        h('p', {}, '정희 님 마음대로 정하시면 돼요.'));
      if (p.picking) {
        c.append(h('p', {}, '어떤 방법이 좋으세요?'),
          ...Object.keys(OPTIONS).filter(k => k !== p.type).map(k =>
            btn(proposalText({ type: k, time: p.time }), () => update(() => { p.status = 'alt'; p.alt = { type: k, time: p.time }; delete p.picking; }))),
          btn('돌아가기', () => update(() => { delete p.picking; }), 'quiet'));
      } else {
        c.append(btn('수락하기', () => update(() => { p.status = 'accepted'; }), 'primary'),
          btn('다른 안으로', () => update(() => { p.picking = true; })),
          btn('지금대로 할게요', () => update(() => { p.status = 'declined'; }), 'quiet'));
      }
      root.append(c);
    } else if (p && p.status !== 'pending') {
      root.append(card('', h('h2', {}, '결정한 내용'), h('p', {}, statusLine(p).replace('정희 님이', '')),
        h('p', { class: 'muted' }, '언제든 다시 바꿀 수 있어요.')));
    } else {
      root.append(card('', h('h2', {}, '받은 제안'), h('p', { class: 'muted' }, '지금은 받은 제안이 없어요.')));
    }

    const share = card('', h('h2', {}, '가족에게 보여 줄 것'));
    if (!state.sharing) {
      share.append(h('p', {}, '지금은 아무것도 공유하지 않아요.'),
        btn('다시 공유하기', () => update(() => { state.sharing = true; }), 'primary'));
      root.append(share);
      return;
    }
    const items = { access: '들어왔는지 여부', practice: '연습 기록', diary: '일기' };
    share.append(...Object.entries(items).map(([k, t]) => h('label', { class: 'choice' },
      h('input', { type: 'checkbox', checked: state.share[k], onchange: e => update(() => { state.share[k] = e.target.checked; }) }),
      h('span', {}, t))));
    share.append(h('p', { class: 'muted' }, '일기는 처음에 꺼져 있어요. 원하실 때만 켜세요.'));
    if (state.confirmStop) {
      share.append(h('p', {}, '공유를 그만하면 민지 님은 기록을 볼 수 없어요. 그만할까요?'),
        btn('네, 그만할게요', () => update(() => { state.sharing = false; state.confirmStop = false; if (state.proposal && state.proposal.status === 'pending') state.proposal = null; }), 'primary'),
        btn('아니요', () => update(() => { state.confirmStop = false; }), 'quiet'));
    } else {
      share.append(btn('공유 그만하기', () => update(() => { state.confirmStop = true; }), 'quiet'));
    }
    root.append(share);
  }

  function render() { renderFamily(); renderMe(); }

  const tabs = [...document.querySelectorAll('[role=tab]')];
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(o => {
      const on = o === t;
      o.setAttribute('aria-selected', on);
      document.getElementById(o.getAttribute('aria-controls')).hidden = !on;
    });
  }));
  document.getElementById('reset').addEventListener('click', () => update(() => { state = fresh(); }));
  render();
})();
</script>
</body>
</html>
